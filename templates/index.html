<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Njord A – Isoleringsliste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #111820;
            --bg-card: #151d28;
            --bg-input: #0d1219;
            --border: #1e2a38;
            --border-focus: #f59e0b;
            --text-primary: #e4e8ee;
            --text-secondary: #7a8599;
            --text-muted: #4a5568;
            --accent: #f59e0b;
            --accent-dim: #b47208;
            --accent-glow: rgba(245, 158, 11, 0.15);
            --success: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            --tag-bg: rgba(245, 158, 11, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 0 32px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--tag-bg);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 4px;
            padding: 4px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .header-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header h1 {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        /* Search */
        .search-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .search-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .search-input:focus ~ .search-icon {
            color: var(--accent);
        }

        .search-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Results */
        .results-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.15s;
            cursor: default;
        }

        .result-card:hover {
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .result-card .tag-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .result-card .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .result-card .desc {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .result-card .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-item .label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .detail-item .value {
            font-size: 13px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .detail-item .value.highlight {
            color: var(--accent);
            font-weight: 600;
        }

        /* Extra details row */
        .extra-details {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .extra-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .extra-tag .et-label {
            color: var(--text-muted);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 12px 0;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }

        .stats-bar span strong {
            color: var(--text-secondary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 32px 0 16px;
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .header h1 { font-size: 22px; }
            .result-card .detail-grid { grid-template-columns: 1fr; }
            .container { padding: 12px; }
            .header { padding: 24px 0 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-badge">
                <span class="dot"></span>
                Njord A — Isoleringsliste
            </div>
            <h1>Utstyrssøk</h1>
            <p>Søk etter TAG, utstyrsnavn eller tavlenummer</p>
        </div>

        <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="F.eks. EM-23-0009A"
                autocomplete="off"
                autofocus
            >
            <div class="search-hint" id="searchHint">Skriv minst 2 tegn for å søke</div>
        </div>

        <div id="resultsMeta" class="results-meta" style="display:none;">
            <span id="resultsCount"></span>
            <span id="resultsQuery"></span>
        </div>

        <div id="results"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Søker...</p>
        </div>

        <div class="empty-state" id="emptyState">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M7 8h10M7 12h6"></path>
            </svg>
            <p>Søk etter utstyrs-TAG for å finne<br>tavle, plassering, felt og låsnummer</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <span>Oppføringer: <strong id="statTotal">—</strong></span>
            <span>Tavler: <strong id="statTavler">—</strong></span>
        </div>

        <div class="footer">
            Njord A Isoleringsliste Lookup &middot; v1.0
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const resultsMeta = document.getElementById('resultsMeta');
        const resultsCount = document.getElementById('resultsCount');
        const resultsQuery = document.getElementById('resultsQuery');
        const loading = document.getElementById('loading');
        const emptyState = document.getElementById('emptyState');
        const searchHint = document.getElementById('searchHint');

        let debounceTimer = null;

        // Load stats
        fetch('/api/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('statTotal').textContent = data.total;
                document.getElementById('statTavler').textContent = data.tavler;
            });

        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const q = searchInput.value.trim();

            if (q.length < 2) {
                resultsDiv.innerHTML = '';
                resultsMeta.style.display = 'none';
                emptyState.style.display = 'block';
                searchHint.textContent = 'Skriv minst 2 tegn for å søke';
                return;
            }

            searchHint.textContent = '';
            debounceTimer = setTimeout(() => doSearch(q), 200);
        });

        async function doSearch(q) {
            loading.classList.add('active');
            emptyState.style.display = 'none';
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                loading.classList.remove('active');

                if (data.results.length === 0) {
                    resultsMeta.style.display = 'none';
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <p>Ingen treff for «<strong>${escapeHtml(q)}</strong>»</p>
                        </div>
                    `;
                    return;
                }

                resultsMeta.style.display = 'flex';
                const shown = Math.min(data.results.length, 50);
                resultsCount.textContent = `${shown}${data.total > 50 ? ' av ' + data.total : ''} treff`;
                resultsQuery.textContent = `"${data.query}"`;

                resultsDiv.innerHTML = data.results.map(item => renderCard(item, q)).join('');

            } catch (err) {
                loading.classList.remove('active');
                resultsDiv.innerHTML = `<div class="empty-state"><p>Feil ved søk. Prøv igjen.</p></div>`;
            }
        }

        function renderCard(item, query) {
            const extraParts = [];
            if (item.sikring) extraParts.push(`<span class="extra-tag"><span class="et-label">Sikring:</span> ${escapeHtml(item.sikring)}</span>`);
            if (item.kw) extraParts.push(`<span class="extra-tag"><span class="et-label">kW:</span> ${escapeHtml(item.kw)}</span>`);
            if (item.last_strom) extraParts.push(`<span class="extra-tag"><span class="et-label">Laststrøm:</span> ${escapeHtml(item.last_strom)}</span>`);
            if (item.motorvarmer_tag) extraParts.push(`<span class="extra-tag"><span class="et-label">Motorvarmer:</span> ${escapeHtml(item.motorvarmer_tag)}</span>`);
            if (item.motorvarmer_fra) extraParts.push(`<span class="extra-tag"><span class="et-label">Matet fra:</span> ${escapeHtml(item.motorvarmer_fra)}</span>`);

            const extraHtml = extraParts.length > 0
                ? `<div class="extra-details">${extraParts.join('')}</div>`
                : '';

            return `
                <div class="result-card">
                    <div class="tag-line">
                        <span class="tag">${highlight(item.utstyr || '—', query)}</span>
                    </div>
                    <div class="desc">${highlight(item.navn || 'Ingen beskrivelse', query)}</div>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <span class="label">Tavle</span>
                            <span class="value">${highlight(item.tavle, query)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Plassering</span>
                            <span class="value highlight">${escapeHtml(item.plassering || '—')}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Felt</span>
                            <span class="value">${escapeHtml(item.felt || '—')}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Lås nr.</span>
                            <span class="value">${escapeHtml(item.laas_nr || '—')}</span>
                        </div>
                    </div>
                    ${extraHtml}
                </div>
            `;
        }

        function highlight(text, query) {
            if (!text || !query) return escapeHtml(text);
            const escaped = escapeHtml(text);
            const qEscaped = escapeHtml(query);
            const regex = new RegExp(`(${qEscaped.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return escaped.replace(regex, '<mark style="background:var(--accent-glow);color:var(--accent);padding:0 2px;border-radius:2px;">$1</mark>');
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Keyboard shortcut: / to focus search
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input'));
                searchInput.blur();
            }
        });
    </script>
</body>
</html>
